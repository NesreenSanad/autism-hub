# Runs the doctor collector every day on GitHub's servers and saves to Supabase.
# Needs one repository secret: DATABASE_URL (Supabase Transaction pooler URI).
name: Daily doctor collector

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 03:00/04:00 Cairo
  workflow_dispatch:        # "Run workflow" button for a manual run

concurrency:
  group: daily-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_SOURCES: ${{ vars.COLLECTOR_SOURCES || 'osm' }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      OVERPASS_URLS: ${{ vars.OVERPASS_URLS }}
      # Download Egypt from Geofabrik instead of asking the (often busy) Overpass servers.
      OSM_METHOD: ${{ vars.OSM_METHOD || 'extract' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install packages
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          pip install -r requirements.txt shapely
      - name: Check the database secret
        run: test -n "$DATABASE_URL" || { echo "Add the DATABASE_URL secret under Settings > Secrets and variables > Actions"; exit 1; }
      - run: python -m jobs.daily_check
